name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix server --no-audit --no-fund
          npm install --prefix client --no-audit --no-fund

      - name: Verify server syntax
        run: node --check server/app.js && node --check server/server.js && node --check api/index.js

      - name: Verify i18n key parity across all languages
        run: node scripts/verify-i18n.mjs

      - name: Verify document file-integrity service
        run: node scripts/verify-file-integrity.mjs

      - name: Build client
        run: npm run build --prefix client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
